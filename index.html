<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 소통창</title>
<link rel="icon" href="girin.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2');
    font-weight: 100;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2');
    font-weight: 200;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
    font-weight: 300;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');
    font-weight: 900;
    font-display: swap;
}

:root{
  --paper:#F4F9FE;    /* 바탕: 연한 하늘 */
  --surface:#FFFFFF;  /* 카드·빈 막대·조작 막대 */
  --mist:#DCEAF7;     /* 테두리·칩 */
  --ochre:#FFE58A;    /* 막대: 레몬 */
  --lead:#FFD54A;     /* 가장 많이 나온 막대 */
  --strong:#A9D3F5;   /* 버튼·선택 표시: 하늘 */
  --soft:#EAF4FD;     /* 선택한 보기 배경 */
  --leaf:#2F6EA5;     /* 강조 글자 */
  --spot:#2F6EA5;     /* 1등 보기 글자 */
  --ink:#2E3A46;      /* 본문 글자 */
  --muted:#6B7A88;
  --alert:#B5482F;
  --font:'Paperozi','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--font);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 20px 40px}
.brand{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--leaf)}
.brand .g{width:26px;height:26px}
.demo{background:var(--ochre);color:var(--ink);padding:2px 8px;border-radius:99px;font-size:12px;margin-left:auto}
.q{font-size:24px;line-height:1.4;font-weight:700;margin:22px 0 8px;word-break:keep-all}
.status{font-size:15px;color:var(--muted);margin:0 0 20px}
.status.open{color:var(--leaf);font-weight:600}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 16px;border-radius:14px;border:2px solid var(--mist);
  background:#FFFDF3;color:var(--ink);font-size:18px;font-weight:600;line-height:1.35;word-break:keep-all;cursor:pointer;transition:border-color .15s,background .15s}
.opt .oimg{flex:none;width:44px;height:44px;object-fit:contain;border-radius:8px}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--mist);background:#fff}
.opt.on{border-color:var(--leaf);background:#FFEFB0}
.opt.on .dot{border-color:var(--spot);background:var(--ochre)}
.opt.multi .dot{border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1;color:var(--ink)}
.opt.multi.on .dot::after{content:"✓"}
.opt:disabled{cursor:default;opacity:.55}
.opt.on:disabled{opacity:1}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;font-size:18px;padding:14px;border-radius:12px;border:2px solid var(--mist);background:#fff;color:var(--ink)}
.send button,.primary{flex:none;padding:0 20px;border-radius:12px;border:0;background:var(--leaf);color:var(--paper);font-size:17px;font-weight:700;cursor:pointer;min-height:52px}
.send button:disabled{opacity:.5}
.mine{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.mine span{background:var(--leaf);color:var(--paper);padding:6px 12px;border-radius:99px;font-size:15px;font-weight:600}
.small{font-size:14px;color:var(--muted);margin:10px 0 0}
.wait{margin-top:60px;text-align:center;color:var(--muted);font-size:17px;line-height:1.6}
.wait .g{width:88px;height:88px;display:block;margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:15px;max-width:90vw;text-align:center;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--alert)}
.foot{margin-top:40px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 하늘레몬 색 */
.opt{background:var(--surface)}
.opt.on{border-color:var(--strong);background:var(--soft)}
.opt.on .dot{background:var(--strong);background-image:none;border-color:var(--strong)}
.opt.multi.on .dot{background:var(--strong);border-color:var(--strong);color:var(--ink)}
.status.open{color:var(--leaf)}
.send button,.primary{background:var(--strong);color:var(--ink)}
.mine span{background:var(--mist);color:var(--ink)}

/* 메모 */
.memo-form{display:grid;gap:8px}
.memo-form textarea{width:100%;min-height:120px;font:inherit;font-size:18px;line-height:1.45;padding:14px;border-radius:12px;border:2px solid var(--mist);background:var(--surface);color:var(--ink);resize:vertical}
.memo-form textarea:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.memo-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.memo-foot .left{font-size:14px;color:var(--muted)}
.memo-foot .primary:disabled{opacity:.5}
.mymemos{display:grid;gap:10px;margin-top:8px}
.mymemos div{padding:12px 14px;border-radius:6px;color:var(--ink);font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 1px 4px rgba(46,58,70,.12)}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><img class="g" src="girin.png" alt="" aria-hidden="true">꿈부자기린쌤 실시간 소통창<span class="demo" id="demo" hidden>연습 모드</span></div>
  <div id="app"><div class="wait"><img class="g" src="girin.png" alt="" aria-hidden="true">연결하는 중이에요…</div></div>
  <p class="foot">응답은 이름 없이 모여요</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="vote-core.js"></script>
<script>
const S = window.VoteStore;
const app = document.getElementById('app');
if (!S.live) document.getElementById('demo').hidden = false;

let state = null, got = false, lastSig = '';
const MINE_KEY = 'girinvote_mine';
const loadMine = () => { try { return JSON.parse(S.local.getItem(MINE_KEY)) || {}; } catch (e){ return {}; } };
const saveMine = (m) => S.local.setItem(MINE_KEY, JSON.stringify(m));

// 보기 이미지 (data:image/ 로 시작하는 값만, img.src로만 넣음)
const isImg = (v) => typeof v === "string" && v.startsWith("data:image/");
function addOptImg(b, i){
  const v = state && Array.isArray(state.optImages) ? state.optImages[i] : "";
  if (!isImg(v)) return;
  const im = document.createElement("img"); im.className = "oimg"; im.alt = ""; im.src = v;
  b.insertBefore(im, b.lastChild);
}

let toastT;
function toast(msg, bad){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2600);
}
const FAIL = '보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';

// 메모 (강사 화면 칠판과 같은 규칙으로 문서 id에서 색을 정함)
const MEMO_MAX = 200;
const MEMO_COLORS = ['#FFF3B0', '#DCEEFF', '#E3F5E1', '#FCE4EC'];
function memoHash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

S.onState(st => { state = st; got = true; render(); }, () => {
  app.innerHTML = '<div class="wait"><img class="g" src="girin.png" alt="" aria-hidden="true">연결이 끊겼어요.<br>와이파이나 데이터를 확인하고 새로고침해 주세요.</div>';
  lastSig = '';
});
setTimeout(() => {
  if (!got) app.innerHTML = '<div class="wait"><img class="g" src="girin.png" alt="" aria-hidden="true">연결이 늦어지고 있어요.<br>와이파이나 데이터를 확인하고 새로고침해 주세요.</div>';
}, 10000);

function render(){
  const key = S.qkey(state);
  const mine = (loadMine()[key]) || {};
  const sig = JSON.stringify([key, state && state.open, state && state.text, state && state.options, state && state.kind, state && !!state.multi, state && state.optImages, mine]);
  if (sig === lastSig) return;          // 입력 중인 글자가 지워지지 않게
  lastSig = sig;

  if (!key){
    app.innerHTML = '<div class="wait"><img class="g" src="girin.png" alt="" aria-hidden="true">강의 화면에 질문이 뜨면<br>여기에도 바로 나타나요.</div>';
    return;
  }
  const open = !!state.open;
  app.innerHTML = '';
  const h = document.createElement('h1'); h.className = 'q'; h.textContent = state.text || '';
  const st = document.createElement('p'); st.className = 'status' + (open ? ' open' : '');
  app.append(h, st);

  if (state.kind === 'word'){
    const words = mine.words || [];
    st.textContent = open ? (words.length >= 3 ? '단어 3개를 모두 보냈어요. 고마워요!' : `단어를 보내 주세요 (${words.length}/3)`)
                          : '지금은 응답을 받지 않아요. 강사님 안내를 기다려 주세요.';
    if (open && words.length < 3){
      const f = document.createElement('form'); f.className = 'send';
      f.innerHTML = '<input maxlength="12" placeholder="12자 이내 단어" aria-label="단어 입력" autocomplete="off" enterkeyhint="send"><button>보내기</button>';
      const inp = f.querySelector('input'), btn = f.querySelector('button');
      f.onsubmit = (e) => {
        e.preventDefault();
        const w = S.normWord(inp.value);
        if (!w){ inp.focus(); return; }
        btn.disabled = true;
        const n = words.length;
        S.setResponse(`${key}__${S.voterId}__w${n}`, { qkey:key, voter:S.voterId, kind:'word', word:w, ts:Date.now() })
          .then(() => {
            const m = loadMine(); m[key] = { words:[...words, w] }; saveMine(m);
            toast(`"${w}" 보냈어요`); render();
            const next = app.querySelector('input'); if (next) next.focus();
          })
          .catch(() => { btn.disabled = false; toast(FAIL, true); });
      };
      app.appendChild(f);
    }
    if (words.length){
      const box = document.createElement('div'); box.className = 'mine';
      words.forEach(w => { const s = document.createElement('span'); s.textContent = w; box.appendChild(s); });
      const p = document.createElement('p'); p.className = 'small'; p.textContent = '내가 보낸 단어';
      app.append(p, box);
    }
    return;
  }

  if (state.kind === 'memo'){
    const memos = Array.isArray(mine.memos) ? mine.memos : [];
    st.textContent = open ? (memos.length >= 3 ? '메모 3장을 모두 붙였어요. 고마워요!' : `메모를 적어 주세요 (${memos.length}/3)`)
                          : '지금은 응답을 받지 않아요. 강사님 안내를 기다려 주세요.';
    if (open && memos.length < 3){
      const f = document.createElement('form'); f.className = 'memo-form';
      f.innerHTML = '<textarea maxlength="200" rows="4" placeholder="200자 이내 메모" aria-label="메모 입력"></textarea>'
        + '<div class="memo-foot"><span class="left" aria-live="polite"></span><button class="primary">붙이기</button></div>';
      const ta = f.querySelector('textarea'), btn = f.querySelector('button'), left = f.querySelector('.left');
      const count = () => { left.textContent = `${MEMO_MAX - ta.value.length}자 남았어요`; };
      ta.oninput = count; count();
      f.onsubmit = (e) => {
        e.preventDefault();
        const text = ta.value.replace(/\r\n?/g, '\n').trim();
        if (!text || text.length > MEMO_MAX){ ta.focus(); return; }
        btn.disabled = true;
        const n = memos.length;
        S.setResponse(`${key}__${S.voterId}__m${n}`, { qkey:key, voter:S.voterId, kind:'memo', text, ts:Date.now() })
          .then(() => {
            const m = loadMine(); m[key] = { memos:[...memos, text] }; saveMine(m);
            toast('메모를 붙였어요'); render();
            const next = app.querySelector('textarea'); if (next) next.focus();
          })
          .catch(() => { btn.disabled = false; toast(FAIL, true); });
      };
      app.appendChild(f);
    }
    if (memos.length){
      const p = document.createElement('p'); p.className = 'small'; p.textContent = '내가 붙인 메모';
      const box = document.createElement('div'); box.className = 'mymemos';
      memos.forEach((t, i) => {
        const c = document.createElement('div'); c.textContent = t;
        c.style.background = MEMO_COLORS[memoHash(`${key}__${S.voterId}__m${i}`) % MEMO_COLORS.length];
        box.appendChild(c);
      });
      app.append(p, box);
    }
    return;
  }

  // 객관식 — 복수 응답
  if (state.multi){
    let cur = Array.isArray(mine.choices) ? mine.choices.slice() : (typeof mine.choice === 'number' ? [mine.choice] : []);
    const setStatus = () => {
      st.textContent = open ? (cur.length ? `${cur.length}개 골랐어요. 마감 전까지 바꿀 수 있어요.` : '여러 개를 고를 수 있어요')
                            : '지금은 응답을 받지 않아요. 강사님 안내를 기다려 주세요.';
    };
    setStatus();
    const list = document.createElement('div'); list.className = 'opts';
    (state.options || []).forEach((o, i) => {
      const b = document.createElement('button');
      const on = cur.includes(i);
      b.className = 'opt multi' + (on ? ' on' : '');
      b.disabled = !open;
      b.setAttribute('aria-pressed', on);
      b.innerHTML = '<span class="dot" aria-hidden="true"></span><span></span>';
      b.lastChild.textContent = o; addOptImg(b, i);
      b.onclick = () => {
        const next = cur.includes(i) ? cur.filter(x => x !== i) : [...cur, i].sort((a, c) => a - c);
        cur = next;
        b.classList.toggle('on', next.includes(i)); b.setAttribute('aria-pressed', next.includes(i)); setStatus();
        S.setResponse(`${key}__${S.voterId}`, { qkey:key, voter:S.voterId, kind:'choice', choices:next, ts:Date.now() })
          .then(() => { const m = loadMine(); m[key] = { choices:next }; saveMine(m); if (cur === next) render(); })
          .catch(() => { toast(FAIL, true); lastSig = ''; render(); });   // 저장된 직전 선택으로 되돌림
      };
      list.appendChild(b);
    });
    app.appendChild(list);
    return;
  }

  // 객관식 — 한 개 선택
  const picked = mine.choice;
  st.textContent = open ? (picked === undefined ? '하나를 골라 주세요' : '선택했어요. 마감 전까지 바꿀 수 있어요.')
                        : '지금은 응답을 받지 않아요. 강사님 안내를 기다려 주세요.';
  const list = document.createElement('div'); list.className = 'opts';
  (state.options || []).forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (picked === i ? ' on' : '');
    b.disabled = !open;
    b.setAttribute('aria-pressed', picked === i);
    b.innerHTML = '<span class="dot" aria-hidden="true"></span><span></span>';
    b.lastChild.textContent = o; addOptImg(b, i);
    b.onclick = () => {
      if (picked === i) return;
      list.querySelectorAll('.opt').forEach(x => x.classList.remove('on')); b.classList.add('on');
      S.setResponse(`${key}__${S.voterId}`, { qkey:key, voter:S.voterId, kind:'choice', choice:i, ts:Date.now() })
        .then(() => { const m = loadMine(); m[key] = { choice:i }; saveMine(m); toast('선택했어요'); render(); })
        .catch(() => { b.classList.remove('on'); toast(FAIL, true); lastSig = ''; render(); });
    };
    list.appendChild(b);
  });
  app.appendChild(list);
}
</script>
</body>
</html>
