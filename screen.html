<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 소통창 · 강사 화면</title>
<link rel="icon" href="girin.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2');
    font-weight: 100;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2');
    font-weight: 200;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
    font-weight: 300;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-display: swap;
}

@font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');
    font-weight: 900;
    font-display: swap;
}

:root{
  --paper:#F4F9FE;    /* 바탕: 연한 하늘 */
  --surface:#FFFFFF;  /* 카드·빈 막대·조작 막대 */
  --mist:#DCEAF7;     /* 테두리·칩 */
  --ochre:#FFE58A;    /* 막대: 레몬 */
  --lead:#FFD54A;     /* 가장 많이 나온 막대 */
  --strong:#A9D3F5;   /* 버튼·선택 표시: 하늘 */
  --soft:#EAF4FD;     /* 선택한 보기 배경 */
  --leaf:#2F6EA5;     /* 강조 글자 */
  --leaf-2:#EAF4FD;
  --spot:#2F6EA5;     /* 1등 보기 글자 */
  --ink:#2E3A46;      /* 본문 글자 */
  --muted:#6B7A88;
  --alert:#B5482F;
  --font:'Paperozi','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 40px 0;color:var(--muted);font-size:15px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--leaf)}
.brand .g{width:36px;height:36px}
.pos{font-variant-numeric:tabular-nums}
.demo{background:var(--ochre);color:var(--ink);padding:3px 10px;border-radius:99px;font-weight:600;font-size:13px;margin-left:10px}

/* 본문 */
.stage{flex:1;display:grid;grid-template-columns:1fr 240px;gap:40px;padding:20px 40px 24px;min-height:0}
.main{display:flex;flex-direction:column;min-height:0}
.q{font-size:clamp(28px,3.6vw,52px);line-height:1.3;font-weight:700;margin:0 0 14px;max-width:28em;word-break:keep-all;letter-spacing:-.01em}
.meta{display:flex;align-items:center;gap:16px;font-size:20px;color:var(--muted);margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;font-weight:600;font-size:17px;background:var(--mist);color:var(--leaf)}
.chip.open{background:var(--leaf);color:var(--paper)}
.chip.open::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ochre);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.chip[hidden]{display:none}
.multi-note{margin:14px 0 0;font-size:15px;color:var(--muted)}
.count b{color:var(--ink);font-size:26px;font-variant-numeric:tabular-nums}
.results{flex:1;min-height:0;overflow:auto}

/* 막대그래프 — 기린 무늬 */
.bars{display:flex;flex-direction:column;gap:18px;max-width:1100px}
.row{display:grid;grid-template-columns:minmax(140px,28%) 1fr 130px;align-items:center;gap:18px}
.label{font-size:clamp(18px,1.9vw,26px);font-weight:600;line-height:1.3;word-break:keep-all}
.track{height:clamp(34px,4.6vh,52px);background:#FFFDF3;border:1.5px solid var(--mist);border-radius:6px 26px 26px 6px;overflow:hidden;position:relative}
.fill{height:100%;width:0;border-radius:6px 26px 26px 6px;transition:width .7s cubic-bezier(.2,.8,.2,1);
  background-color:var(--ochre);opacity:.95}
.row.lead .fill{opacity:1}
.row.lead .label{color:var(--spot)}
.val{font-size:clamp(20px,2.1vw,30px);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.val small{font-size:.6em;color:var(--muted);font-weight:600;margin-left:6px}
.hidden-note{margin-top:24px;font-size:20px;color:var(--muted)}

/* 워드클라우드 */
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:baseline;gap:10px 26px;min-height:100%;padding:10px 0 20px;max-width:1200px;margin:0 auto}
.w{font-weight:700;line-height:1.15;transition:font-size .5s ease;word-break:keep-all}
.w.new{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.empty{font-size:22px;color:var(--muted);padding:30px 0}

/* 메모 칠판 */
.memo-tools{display:flex;justify-content:flex-end;font-size:14px;color:var(--muted);margin:0 0 8px;min-height:1px}
.memo-tools button{background:none;border:0;padding:2px;font-size:14px;color:var(--leaf);text-decoration:underline}
.board{display:flex;align-items:flex-start;gap:18px;padding:4px 4px 20px}
.bcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.memo{break-inside:avoid;margin:0 0 18px;padding:18px 20px;border-radius:6px;color:var(--ink);font-size:23px;line-height:1.45;
  white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 2px 6px rgba(46,58,70,.12);cursor:zoom-in}
.memo:focus-visible{outline:3px solid var(--strong);outline-offset:2px}
.memo.new{animation:memoPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes memoPop{from{transform:scale(.6) translateY(16px);opacity:0}}
#memoView{background:transparent;width:min(900px,92vw);overflow:visible;max-height:none}
#memoView:focus,#memoView:focus-visible,#memoView .big:focus,#memoView .big:focus-visible{outline:none}
#memoView .big{padding:40px 44px;border-radius:10px;color:var(--ink);font-size:clamp(28px,3.2vw,44px);line-height:1.45;
  white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;max-height:70vh;overflow:auto;box-shadow:0 10px 30px rgba(46,58,70,.25)}
#memoView .acts{display:flex;justify-content:center;gap:10px;margin-top:16px}
#memoView .acts button{border-radius:10px;padding:10px 18px;font-size:16px;font-weight:600;border:1.5px solid var(--mist);background:var(--surface);color:var(--ink)}

/* QR 옆 패널 */
.side{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px;text-align:center}
.qrbox{background:#fff;padding:12px;border-radius:14px;cursor:zoom-in;border:2px solid var(--mist)}
.qrbox img,.qrbox canvas{display:block}
.side p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
.url{font-size:13px;word-break:break-all;color:var(--leaf)}
.linkbtn{background:none;border:0;color:var(--leaf);text-decoration:underline;font-size:13px;padding:2px}

/* 하단 조작 막대 */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--leaf);color:var(--paper);padding:10px 24px}
.bar button{background:transparent;color:var(--paper);border:1.5px solid rgba(255,247,214,.35);border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600}
.bar button:hover{background:var(--leaf-2)}
.bar button.go{background:var(--ochre);color:var(--ink);border-color:var(--ochre)}
.bar button.stop{background:var(--paper);color:var(--leaf);border-color:var(--paper)}
.bar .sep{width:1px;height:26px;background:rgba(255,247,214,.25);margin:0 6px}
.bar .keys{margin-left:auto;font-size:13px;opacity:.7}
.bar #logoutBtn{font-size:13px;padding:5px 10px}
.bar #logoutBtn[hidden]{display:none}

/* 강사 로그인 잠금 */
.lock{position:fixed;inset:0;z-index:50;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.lock[hidden]{display:none}
.lock img{width:120px;height:120px}
.lock h2{margin:0;font-size:clamp(26px,3vw,38px)}
.lock p{margin:0;font-size:18px;color:var(--muted);max-width:32em}
.lock p:empty{display:none}
.lock button{border:0;border-radius:12px;padding:14px 26px;font-size:18px;font-weight:700;background:var(--strong);color:var(--ink)}
.lock button[hidden]{display:none}
body.bar-off .bar{display:none}

/* QR 크게 */
.overlay{position:fixed;inset:0;background:var(--paper);color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:20;cursor:zoom-out}
.overlay.on{display:flex}
.overlay .qrbig{background:#fff;padding:22px;border-radius:22px}
.overlay h2{margin:0;font-size:clamp(26px,3.4vw,44px)}
.overlay p{margin:0;font-size:20px;opacity:.85}

/* 오류 */
.err{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--alert);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;display:none;z-index:30;max-width:90vw}

/* 질문 편집 */
dialog{border:0;border-radius:18px;padding:0;width:min(760px,94vw);max-height:90vh;background:var(--paper);color:var(--ink);font-family:var(--font)}
dialog::backdrop{background:rgba(59,46,30,.55)}
.ed{display:flex;flex-direction:column;max-height:90vh}
.ed-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--mist)}
.ed-head h2{margin:0;font-size:22px}
.ed-list{overflow:auto;padding:16px 24px;display:flex;flex-direction:column;gap:14px}
.item{background:#fff;border:1.5px solid var(--mist);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.item.bad{border-color:var(--alert)}
.item-top{display:flex;gap:8px;align-items:center}
.item-top .n{font-weight:700;color:var(--leaf);min-width:2em}
.item select,.item textarea{font:inherit;font-size:16px;border:1.5px solid var(--mist);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);width:100%}
.item select{width:auto}
.item textarea{resize:vertical}
.item .hint{font-size:13px;color:var(--muted);margin:-4px 0 0}
.item .warn{font-size:13px;color:var(--alert);margin:0}
.item .multi{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;width:max-content}
.item .multi[hidden]{display:none}
.item .multi input{width:18px;height:18px;accent-color:var(--leaf);margin:0}
.orows{display:flex;flex-direction:column;gap:8px}
.orows[hidden]{display:none}
.orow{display:flex;align-items:center;gap:6px}
.orow .otext{flex:1;min-width:0;font:inherit;font-size:16px;border:1.5px solid var(--mist);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink)}
.oimg{position:relative;flex:none;width:48px;height:48px;border:1.5px dashed var(--mist);border-radius:10px;background:var(--paper);color:var(--muted);font-size:11px;line-height:1.15;padding:0;display:flex;align-items:center;justify-content:center;text-align:center}
.oimg.has{border-style:solid;background:#fff}
.oimg img{width:100%;height:100%;object-fit:contain;border-radius:8px;display:block}
.oimg .x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:12px;line-height:20px;padding:0;text-align:center}
.oadd{align-self:flex-start}
.mini:disabled{opacity:.4;cursor:default}
.mini{background:transparent;border:1.5px solid var(--mist);border-radius:8px;padding:5px 10px;font-size:14px;color:var(--ink)}
.mini.del{color:var(--alert);margin-left:auto}
.ed-foot{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--mist)}
.btn{border-radius:10px;padding:9px 16px;font-size:15px;font-weight:600;border:1.5px solid var(--leaf);background:transparent;color:var(--leaf)}
.btn.primary{background:var(--leaf);color:var(--paper);margin-left:auto}
.ed-empty{color:var(--muted);text-align:center;padding:24px 0}
.linkf{display:grid;gap:8px}
.linkf[hidden]{display:none}
.linkf input{font:inherit;font-size:16px;border:1.5px solid var(--mist);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);width:100%}
.item .hint:empty{display:none}

/* 링크 안내 */
body.link-mode .stage{grid-template-columns:1fr}
body.link-mode .side,body.link-mode .meta{display:none}
.bar button:disabled{opacity:.35;cursor:default}
.bar button:disabled:hover{background:transparent}
.linkview{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0 10px;text-align:center}
.linkqr{background:#fff;padding:16px;border-radius:16px;border:2px solid var(--mist)}
.linkqr img,.linkqr canvas{display:block}
.linkurl{margin:0;font-size:clamp(20px,2vw,30px);font-weight:600;color:var(--leaf);word-break:break-all;max-width:90%}
.linkdesc{margin:0;font-size:clamp(18px,1.7vw,24px);color:var(--muted);max-width:90%;word-break:keep-all}
.label.has-img{display:flex;align-items:center;gap:12px}
.label .limg{flex:none;width:48px;height:48px;object-fit:contain;border-radius:8px}

@media (max-width:900px){
  body{overflow:auto}
  .stage{grid-template-columns:1fr;padding:16px 20px}
  .side{flex-direction:row;justify-content:flex-start;text-align:left}
  .row{grid-template-columns:1fr 90px}
  .row .label{grid-column:1/-1}
  .top{padding:14px 20px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 하늘레몬 색 */
.track{background:var(--surface)}
.row.lead .fill{background-color:var(--lead)}
.chip{background:var(--mist);color:var(--ink)}
.chip.open{background:var(--strong);color:var(--ink)}
.chip.open::before{background:var(--ink)}
.bar{background:var(--surface);color:var(--ink);border-top:1.5px solid var(--mist)}
.bar button{color:var(--ink);border-color:var(--mist)}
.bar button:hover{background:var(--paper)}
.bar button.go{background:var(--strong);border-color:var(--strong);color:var(--ink)}
.bar button.stop{background:var(--lead);border-color:var(--lead);color:var(--ink)}
.bar .sep{background:var(--mist)}
.qrbox{border-color:var(--mist)}
.btn{border-color:var(--strong);color:var(--ink)}
.btn.primary{background:var(--strong);color:var(--ink)}
dialog::backdrop{background:rgba(46,58,70,.35)}
</style>
</head>
<body>
<div class="err" id="err" role="alert"></div>

<div class="lock" id="lock" role="dialog" aria-label="강사 로그인">
  <img src="girin.png" alt="" aria-hidden="true">
  <h2 id="lockTitle">강사 화면이에요</h2>
  <p id="lockMsg"></p>
  <button id="loginBtn" hidden>구글 계정으로 로그인</button>
</div>

<header class="top">
  <div class="brand"><img class="g" src="girin.png" alt="" aria-hidden="true">꿈부자기린쌤 실시간 소통창<span id="demoBadge" class="demo" hidden>연습 모드</span></div>
  <div class="pos" id="pos"></div>
</header>

<section class="stage">
  <div class="main">
    <h1 class="q" id="qText">질문을 불러오는 중이에요</h1>
    <div class="meta">
      <span class="chip" id="chip">대기</span>
      <span class="chip" id="multiChip" hidden>복수 응답</span>
      <span class="count">참여 <b id="voters">0</b>명</span>
    </div>
    <div class="results" id="results"></div>
  </div>
  <aside class="side">
    <div class="qrbox" id="qrSmall" title="크게 보기 (Q)" role="button" tabindex="0" aria-label="QR 크게 보기"></div>
    <div>
      <p>휴대폰 카메라로<br>QR을 찍어 주세요</p>
      <p class="url" id="urlText"></p>
      <button class="linkbtn" id="urlEdit">주소 바꾸기</button>
    </div>
  </aside>
</section>

<nav class="bar" aria-label="강사 조작">
  <button id="prev" aria-label="이전 질문">◀ 이전</button>
  <button id="next" aria-label="다음 질문">다음 ▶</button>
  <span class="sep"></span>
  <button id="openBtn" class="go">응답 시작</button>
  <button id="showBtn">결과 숨기기</button>
  <button id="resetBtn">응답 비우기</button>
  <span class="sep"></span>
  <button id="qrBtn">QR 크게</button>
  <button id="editBtn">질문 편집</button>
  <span class="keys">←→ 질문 · Space 시작/마감 · R 결과 · Q QR · B 조작 막대</span>
  <button id="logoutBtn" hidden>로그아웃</button>
</nav>

<div class="overlay" id="overlay" role="dialog" aria-label="접속 QR">
  <h2>QR을 찍고 함께 참여해 주세요</h2>
  <div class="qrbig" id="qrBig"></div>
  <p id="urlBig"></p>
</div>

<dialog id="memoView" aria-label="메모 크게 보기">
  <div class="big" id="memoBig"></div>
  <div class="acts"><button id="memoHide">칠판에서 숨기기</button><button id="memoClose">닫기</button></div>
</dialog>

<dialog id="editor">
  <div class="ed">
    <div class="ed-head"><h2>질문 편집</h2><button class="mini" id="edCancel">취소</button></div>
    <div class="ed-list" id="edList"></div>
    <div class="ed-foot">
      <button class="btn" id="edAddChoice">+ 객관식 질문</button>
      <button class="btn" id="edAddWord">+ 단어 질문</button>
      <button class="btn" id="edSample">예시 질문 넣기</button>
      <button class="btn primary" id="edSave">저장</button>
    </div>
  </div>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="vote-core.js"></script>
<script>
const S = window.VoteStore;
const $ = (s) => document.querySelector(s);
const isImg = (v) => typeof v === 'string' && v.startsWith('data:image/');
let questions = [], state = null, responses = [], showResults = true;
let unsubResp = null, curKey = null, seenWords = new Set(), seenMemos = new Set(), autoStarted = false, qLoaded = false, stateLoaded = false;

if (!S.live) $('#demoBadge').hidden = false;

/* ── 오류 표시 ── */
let errTimer;
function onErr(e){
  const el = $('#err');
  el.textContent = (e && e.code === 'permission-denied')
    ? '로그인이 풀렸어요. 다시 로그인해 주세요'
    : '연결 오류: ' + (e && e.message ? e.message : e) + ' — 인터넷 연결, config.js, Firebase 보안 규칙을 확인해 주세요.';
  el.style.display = 'block'; clearTimeout(errTimer); errTimer = setTimeout(() => el.style.display = 'none', 9000);
}

/* ── 구독 ── */
// 질문·상태 구독과 자동 시작은 강사 로그인이 확인된 뒤에 시작
let synced = false;
function startSync(){
  if (synced) return;
  synced = true;
  S.onQuestions(qs => { questions = qs; qLoaded = true; maybeAutoStart(); render(); }, onErr);
  S.onState(st => { state = st; stateLoaded = true; watchResponses(); maybeAutoStart(); render(); }, onErr);
}

/* ── 강사 로그인 ── */
let locked = true, wrongAccount = false;
const isAdmin = (u) => !!(u && u.email && u.verified && window.ADMIN_EMAIL
  && u.email.toLowerCase() === String(window.ADMIN_EMAIL).toLowerCase());
function showLock(title, msg, btn){
  locked = true;
  $('#lockTitle').textContent = title; $('#lockMsg').textContent = msg || '';
  $('#loginBtn').textContent = btn; $('#loginBtn').hidden = false; $('#loginBtn').disabled = false;
  $('#lock').hidden = false;
}
S.onAuth(u => {
  if (u && (u.demo || isAdmin(u))){
    locked = false; wrongAccount = false;
    $('#lock').hidden = true;
    $('#logoutBtn').hidden = !!u.demo;
    startSync();
  } else if (u){
    wrongAccount = true;
    $('#logoutBtn').hidden = true;
    showLock('강사 계정이 아니에요', u.email, '다른 계정으로 로그인');
  } else {
    wrongAccount = false;
    $('#logoutBtn').hidden = true;
    showLock('강사 화면이에요', location.protocol === 'file:' ? '강사 화면은 GitHub Pages 주소로 열어 주세요' : '', '구글 계정으로 로그인');
  }
});
$('#loginBtn').onclick = async () => {
  $('#loginBtn').disabled = true; $('#lockMsg').textContent = '';
  try {
    if (wrongAccount) await S.signOut();
    await S.signIn();
  } catch (e){
    const code = (e && e.code) || '';
    if (code !== 'auth/popup-closed-by-user' && code !== 'auth/cancelled-popup-request')
      $('#lockMsg').textContent = code === 'auth/unauthorized-domain' ? '이 주소에서는 로그인할 수 없어요 (Firebase 승인된 도메인 확인)'
        : code === 'auth/popup-blocked' ? '로그인 창이 막혔어요. 브라우저의 팝업 허용을 확인해 주세요'
        : '로그인하지 못했어요 (' + (code || (e && e.message) || e) + ')';
  } finally { $('#loginBtn').disabled = false; }
};
$('#logoutBtn').onclick = () => { closeMemo(); if ($('#editor').open) $('#editor').close(); S.signOut().catch(onErr); };

function maybeAutoStart(){
  // 처음 열었을 때 띄운 질문이 없으면 첫 질문을 띄움
  // 질문 목록과 현재 상태를 둘 다 처음 받은 뒤에만 판단 (먼저 온 쪽만 보고 1번으로 돌아가지 않게)
  // state의 qid가 목록에 없어도(삭제된 질문) 자동으로 바꾸지 않음
  if (autoStarted || !qLoaded || !stateLoaded) return;
  autoStarted = true;
  if ((!state || !state.qid) && questions.length) goTo(0);
}
function watchResponses(){
  const k = S.qkey(state);
  if (k === curKey) return;
  curKey = k; seenWords = new Set(); seenMemos = new Set();
  if (unsubResp) unsubResp();
  unsubResp = null; responses = [];
  if (k) unsubResp = S.onResponses(k, rs => { responses = rs; renderResults(); }, onErr);
}

/* ── 조작 ── */
const curIndex = () => state ? questions.findIndex(q => q.id === state.qid) : -1;
function goTo(i){
  const q = questions[i]; if (!q) return;
  S.setState({ qid:q.id, kind:q.kind, text:q.text, options:q.options || [], optImages:q.optImages || [], multi:!!q.multi, url:q.url || '', desc:q.desc || '', round:q.round || 0, open:false, hidden:[] }).catch(onErr);
}
function step(d){ const i = curIndex(); goTo(i < 0 ? 0 : Math.min(Math.max(i + d, 0), questions.length - 1)); }
const isLink = () => !!(state && state.qid && state.kind === 'link');
function toggleOpen(){ if (state && state.qid && !isLink()) S.setState({ open: !state.open }).catch(onErr); }
function toggleShow(){ if (isLink()) return; showResults = !showResults; render(); }
function resetQ(){
  const q = questions[curIndex()]; if (!q || isLink()) return;
  if (!confirm('지금 질문의 응답을 모두 비우고 처음부터 다시 받을까요?')) return;
  const r = (q.round || 0) + 1;
  S.saveQuestion({ ...q, round:r }).then(() => S.setState({ round:r, hidden:[] })).catch(onErr);
}

$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
$('#openBtn').onclick = toggleOpen;
$('#showBtn').onclick = toggleShow;
$('#resetBtn').onclick = resetQ;
$('#qrBtn').onclick = () => toggleQR(true);
$('#qrSmall').onclick = () => toggleQR(true);
$('#qrSmall').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleQR(true); } };
$('#overlay').onclick = () => toggleQR(false);
$('#editBtn').onclick = openEditor;

document.addEventListener('keydown', (e) => {
  if (locked || $('#editor').open || $('#memoView').open || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright') step(1);
  else if (k === 'arrowleft') step(-1);
  else if (k === ' ') { e.preventDefault(); toggleOpen(); }
  else if (k === 'r') toggleShow();
  else if (k === 'q') toggleQR();
  else if (k === 'b') document.body.classList.toggle('bar-off');
  else if (k === 'escape') toggleQR(false);
});

/* ── 그리기 ── */
function render(){
  const i = curIndex();
  $('#pos').textContent = questions.length ? `질문 ${i < 0 ? '-' : i + 1} / ${questions.length}` : '';
  if (!state || !state.qid){
    $('#qText').textContent = questions.length ? '◀ ▶ 버튼으로 질문을 띄워 주세요' : '아래 [질문 편집]에서 첫 질문을 만들어 보세요';
  } else $('#qText').textContent = state.text || '';
  const open = !!(state && state.open);
  const chip = $('#chip');
  chip.className = 'chip' + (open ? ' open' : '');
  chip.textContent = !state || !state.qid ? '대기' : open ? '응답 중' : (responses.length ? '마감' : '시작 전');
  $('#multiChip').hidden = !(state && state.qid && state.kind !== 'word' && state.multi);
  const ob = $('#openBtn');
  ob.textContent = open ? '응답 마감' : '응답 시작';
  ob.className = open ? 'stop' : 'go';
  $('#showBtn').textContent = showResults ? '결과 숨기기' : '결과 보이기';
  const link = isLink();
  document.body.classList.toggle('link-mode', link);
  ['#openBtn', '#showBtn', '#resetBtn'].forEach(s => { $(s).disabled = link; });
  renderResults();
}

function renderResults(){
  const box = $('#results');
  const voters = new Set(responses.map(r => r.voter)).size;
  $('#voters').textContent = voters;
  if (!state || !state.qid){ box.innerHTML = ''; box.dataset.sig = ''; return; }
  if (state.kind === 'word') return renderCloud(box);
  if (state.kind === 'memo') return renderBoard(box);
  if (state.kind === 'link') return renderLink(box);
  renderBars(box);
}

/* ── 링크 안내 ── */
const isHttp = (u) => typeof u === 'string' && /^https?:\/\/\S+$/i.test(u.trim());
function renderLink(box){
  const url = (state.url || '').trim();
  const sig = 'link:' + JSON.stringify([url, state.desc || '', innerWidth, innerHeight]);
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig; box.innerHTML = '';
  const v = document.createElement('div'); v.className = 'linkview';
  if (!isHttp(url)){
    const p = document.createElement('p'); p.className = 'empty'; p.textContent = '주소는 https://로 시작해야 해요';
    v.appendChild(p); box.appendChild(v); return;
  }
  const qr = document.createElement('div'); qr.className = 'linkqr';
  const u = document.createElement('p'); u.className = 'linkurl'; u.textContent = url.replace(/^https?:\/\//i, '');
  v.append(qr, u);
  if (state.desc){ const d = document.createElement('p'); d.className = 'linkdesc'; d.textContent = state.desc; v.appendChild(d); }
  box.appendChild(v);
  if (!window.QRCode){ qr.textContent = 'QR 도구를 불러오지 못했어요 (인터넷 확인)'; return; }
  // 화면 높이의 50% 정도, 단 주소·설명까지 결과 영역 안에 들어가게 (QR을 뺀 높이를 재서 남은 만큼)
  const room = box.clientHeight - v.offsetHeight - 4;
  const size = Math.max(160, Math.min(Math.round(innerHeight * 0.5), room));
  try { new QRCode(qr, { text:url, width:size, height:size, colorDark:'#2E3A46', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M }); }
  catch (e){ qr.textContent = '주소가 너무 길어서 QR을 만들지 못했어요'; }
}
addEventListener('resize', () => { clearTimeout(window._lkT); window._lkT = setTimeout(() => { if (isLink()) renderResults(); }, 300); });

/* ── 메모 칠판 ── */
const MEMO_COLORS = ['#FFF3B0', '#DCEEFF', '#E3F5E1', '#FCE4EC'];
const memoColor = (id) => MEMO_COLORS[hash(String(id)) % MEMO_COLORS.length];
let memoOpenId = null;
// 칸 수: 화면 폭 1500px 미만 3칸, 1500px 이상 4칸, 1900px 이상 5칸
const memoCols = () => innerWidth >= 1900 ? 5 : innerWidth >= 1500 ? 4 : 3;
let boardView = null;   // { key, el, cols, placed }
function makeMemoCard(r){
  const m = document.createElement('div'); m.className = 'memo';
  m.tabIndex = 0; m.setAttribute('role', 'button');
  m.style.background = memoColor(r._id);
  m.textContent = r.text;
  if (!seenMemos.has(r._id)){ m.classList.add('new'); seenMemos.add(r._id); }
  m.onclick = () => openMemo(r);
  m.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openMemo(r); } };
  return m;
}
function placeMemo(view, r){
  // 지금 가장 짧은 칸 맨 아래에 붙임 (높이가 같으면 왼쪽 칸)
  let best = view.cols[0];
  for (const c of view.cols) if (c.offsetHeight < best.offsetHeight) best = c;
  best.appendChild(makeMemoCard(r));
  view.placed.add(r._id);
}
function renderBoard(box){
  box.dataset.sig = 'memo';
  const hiddenList = state && Array.isArray(state.hidden) ? state.hidden : [];
  const hidden = new Set(hiddenList);
  const all = responses.filter(r => r.kind === 'memo' && typeof r.text === 'string' && r.text.trim())
    .sort((a, b) => (a.ts || 0) - (b.ts || 0) || String(a._id).localeCompare(String(b._id)));
  const shown = all.filter(r => !hidden.has(r._id));
  const hiddenN = all.length - shown.length;
  if (!showResults){
    boardView = null;
    box.innerHTML = `<p class="empty">메모 ${all.length}장이 모였어요. 잠시 후 공개해요.</p>`; return;
  }
  // 숨기기·다시 보이기, 질문 바뀜, 칸 수 바뀜일 때만 전체를 다시 배치
  const key = JSON.stringify([curKey, [...hiddenList].sort(), memoCols()]);
  const intact = boardView && boardView.key === key && box.contains(boardView.el);
  if (intact){
    // 새 메모만 추가 (기존 카드는 그대로)
    shown.forEach(r => { if (!boardView.placed.has(r._id)) placeMemo(boardView, r); });
  } else {
    const keepScroll = box.scrollTop;
    box.innerHTML = '';
    boardView = null;
    const tools = document.createElement('div'); tools.className = 'memo-tools';
    if (hiddenN){
      tools.append(`숨긴 메모 ${hiddenN}개 · `);
      const b = document.createElement('button'); b.textContent = '다시 보이기';
      b.onclick = () => S.setState({ hidden:[] }).catch(onErr);
      tools.appendChild(b);
    }
    box.appendChild(tools);
    if (!shown.length){
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = '아직 붙은 메모가 없어요. QR을 찍고 메모를 남겨 주세요.';
      box.appendChild(p);
    } else {
      const board = document.createElement('div'); board.className = 'board';
      const cols = [];
      for (let i = 0; i < memoCols(); i++){ const c = document.createElement('div'); c.className = 'bcol'; board.appendChild(c); cols.push(c); }
      box.appendChild(board);
      boardView = { key, el:board, cols, placed:new Set() };
      shown.forEach(r => placeMemo(boardView, r));
    }
    box.scrollTop = keepScroll;
  }
  if (memoOpenId && !shown.some(r => r._id === memoOpenId)) closeMemo();
}
addEventListener('resize', () => {
  clearTimeout(window._bdT);
  window._bdT = setTimeout(() => { if (state && state.kind === 'memo' && boardView && !boardView.key.endsWith(memoCols() + ']')) renderResults(); }, 200);
});
function openMemo(r){
  memoOpenId = r._id;
  const big = $('#memoBig'); big.textContent = r.text; big.style.background = memoColor(r._id);
  if (!$('#memoView').open) $('#memoView').showModal();
}
function closeMemo(){ memoOpenId = null; if ($('#memoView').open) $('#memoView').close(); }
$('#memoClose').onclick = closeMemo;
$('#memoHide').onclick = () => {
  const id = memoOpenId; if (!id) return;
  const cur = state && Array.isArray(state.hidden) ? state.hidden : [];
  closeMemo();
  if (!cur.includes(id)) S.setState({ hidden:[...cur, id] }).catch(onErr);
};
$('#memoView').addEventListener('click', (e) => { if (e.target === $('#memoView')) closeMemo(); });
$('#memoView').addEventListener('close', () => { memoOpenId = null; });

function renderBars(box){
  const opts = state.options || [];
  const imgs = Array.isArray(state.optImages) ? state.optImages : [];
  const sig = 'bars:' + JSON.stringify([opts, imgs]);
  if (box.dataset.sig !== sig){
    box.dataset.sig = sig; box.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className = 'bars';
    opts.forEach((o, i) => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<div class="label"></div><div class="track"><div class="fill"></div></div><div class="val"></div>';
      const label = row.querySelector('.label');
      if (isImg(imgs[i])){
        const im = document.createElement('img'); im.className = 'limg'; im.alt = ''; im.src = imgs[i];
        const tx = document.createElement('span'); tx.textContent = o;
        label.classList.add('has-img'); label.append(im, tx);
      } else label.textContent = o;
      wrap.appendChild(row);
    });
    const mnote = document.createElement('p'); mnote.className = 'multi-note';
    mnote.textContent = '응답한 사람 중 고른 비율이라 합이 100%를 넘을 수 있어요';
    const note = document.createElement('p'); note.className = 'hidden-note';
    box.append(wrap, mnote, note);
  }
  const counts = opts.map(() => 0);
  let total = 0;                                   // 하나 이상 고른 응답자 수 (비율의 기준)
  responses.forEach(r => {
    if (r.kind !== 'choice') return;
    const picks = Array.isArray(r.choices) ? [...new Set(r.choices)] : (typeof r.choice === 'number' ? [r.choice] : []);
    const valid = picks.filter(i => Number.isInteger(i) && counts[i] !== undefined);
    if (!valid.length) return;
    total++;
    valid.forEach(i => counts[i]++);
  });
  const max = Math.max(0, ...counts);
  box.querySelector('.multi-note').hidden = !(state.multi && showResults);
  box.querySelectorAll('.row').forEach((row, i) => {
    const c = counts[i], pct = total ? Math.round(c / total * 100) : 0;
    row.classList.toggle('lead', showResults && c > 0 && c === max);
    row.querySelector('.fill').style.width = showResults ? pct + '%' : '0%';
    row.querySelector('.val').innerHTML = showResults ? `${c}<small>${pct}%</small>` : '<small>?</small>';
  });
  box.querySelector('.hidden-note').textContent =
    showResults ? (total ? '' : '아직 응답이 없어요. QR을 찍고 들어와 주세요.') : `응답 ${total}개가 모였어요. 결과는 잠시 후 공개해요.`;
}

const PALETTE = ['#2F6EA5', '#B98500', '#4C86BF', '#8A6A00', '#3E5F7E'];
function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function renderCloud(box){
  box.dataset.sig = 'cloud';
  const counts = new Map();
  responses.forEach(r => { if (r.kind === 'word'){ const w = S.normWord(r.word); if (w) counts.set(w, (counts.get(w) || 0) + 1); } });
  const total = [...counts.values()].reduce((a, b) => a + b, 0);
  box.innerHTML = '';
  if (!showResults){
    box.innerHTML = `<p class="empty">단어 ${total}개가 모였어요. 결과는 잠시 후 공개해요.</p>`; return;
  }
  if (!counts.size){ box.innerHTML = '<p class="empty">아직 들어온 단어가 없어요. QR을 찍고 단어를 보내 주세요.</p>'; return; }
  const max = Math.max(...counts.values());
  const words = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 60)
    .sort((a, b) => hash(a[0]) - hash(b[0]));               // 새 단어가 와도 자리가 크게 흔들리지 않게
  const cloud = document.createElement('div'); cloud.className = 'cloud';
  words.forEach(([w, c]) => {
    const s = document.createElement('span'); s.className = 'w';
    const size = 22 + Math.sqrt(c / max) * 66;
    s.style.fontSize = size + 'px';
    s.style.color = PALETTE[hash(w) % PALETTE.length];
    s.textContent = w; s.title = `${w} · ${c}`;
    if (!seenWords.has(w)){ s.classList.add('new'); seenWords.add(w); }
    if (c > 1){ const n = document.createElement('sup'); n.textContent = ' ' + c; n.style.cssText = 'font-size:.42em;opacity:.6'; s.appendChild(n); }
    cloud.appendChild(s);
  });
  box.appendChild(cloud);
}

function toggleQR(force){ $('#overlay').classList.toggle('on', force); }
$('#urlEdit').onclick = () => {

/* ── 질문 편집 ── */
let draft = [];
const SAMPLES = [
  { kind:'choice', text:'집단 활동 중 한 아이가 친구 말을 자꾸 끊고 자기 이야기만 해요. 먼저 해 볼 방법은?',

function openEditor(){

}
function toRows(options = [], images = []){

}
function addDraft(kind, text = '', options = []){

/* 보기 이미지: 최대 160×160으로 줄여 webp data URL로 (한 장 60KB 이하) */
const IMG_MAX = 160, IMG_BYTES = 60 * 1024, Q_BYTES = 900 * 1024;
function loadImage(blob){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했어요')); };
    im.src = url;
  });
}
async function shrinkImage(blob){
  const im = await loadImage(blob);
  const w0 = im.naturalWidth || IMG_MAX, h0 = im.naturalHeight || IMG_MAX;
  let side = IMG_MAX, q = 0.85, out = '';
  for (let k = 0; k < 12; k++){
    const s = Math.min(1, side / Math.max(w0, h0));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w0 * s)); c.height = Math.max(1, Math.round(h0 * s));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    out = c.toDataURL('image/webp', q);
    if (out.length * 0.75 <= IMG_BYTES) break;
    side = Math.round(side * 0.8); q = Math.max(0.5, q - 0.1);
  }
  return out;
}
const picker = document.createElement('input');
picker.type = 'file'; picker.accept = 'image/*'; picker.hidden = true; document.body.appendChild(picker);
let pickTarget = null;
picker.onchange = () => { const f = picker.files[0]; picker.value = ''; if (f && pickTarget) setRowImage(pickTarget, f); };
async function setRowImage(row, blob){
  try { row.img = await shrinkImage(blob); renderEditor(); }
  catch (e){ onErr(e); }
}
// 보기 글자칸이나 이미지 칸에 초점이 있을 때 Ctrl+V로 이미지 붙여 넣기
$('#editor').addEventListener('paste', (e) => {
  const el = document.activeElement && document.activeElement.closest('.orow');
  if (!el) return;
  const file = [...(e.clipboardData ? e.clipboardData.items : [])].find(it => it.kind === 'file' && it.type.startsWith('image/'));
  if (!file) return;
  e.preventDefault();
  const q = draft[+el.dataset.q], row = q && q.rows[+el.dataset.r];
  if (row) setRowImage(row, file.getAsFile());
});

function renderEditor(){
  const list = $('#edList');
  const fr = document.activeElement && document.activeElement.closest && document.activeElement.closest('.orow');
  const focus = fr ? { q:fr.dataset.q, r:fr.dataset.r, img:document.activeElement.classList.contains('oimg') } : null;
  list.innerHTML = '';
  if (!draft.length){ list.innerHTML = '<p class="ed-empty">아직 질문이 없어요. 아래 버튼으로 질문을 추가해 보세요.</p>'; return; }
  draft.forEach((q, i) => {
    const it = document.createElement('div'); it.className = 'item'; it.dataset.i = i;
    it.innerHTML = `
      <div class="item-top">
        <span class="n">${i + 1}</span>
        <select aria-label="질문 형식"><option value="choice">객관식</option><option value="word">단어 응답</option><option value="memo">메모</option><option value="link">링크 안내</option></select>
        <button class="mini up" aria-label="위로">▲</button><button class="mini down" aria-label="아래로">▼</button>
        <button class="mini del">삭제</button>
      </div>
      <textarea class="t" rows="2" placeholder="질문을 입력하세요" aria-label="질문"></textarea>
      <div class="orows"></div>
      <div class="linkf"><input class="u" type="url" inputmode="url" placeholder="https://" aria-label="주소"><input class="dsc" placeholder="설명 한 줄 (선택)" aria-label="설명" maxlength="120"></div>
      <label class="multi"><input type="checkbox" class="m">복수 응답 허용</label>
      <p class="hint">${q.kind === 'choice' ? '보기는 한 줄에 하나씩, 2~8개' : q.kind === 'memo' ? '참여자 한 명이 200자 이내 메모를 3장까지 붙일 수 있어요' : q.kind === 'link' ? '' : '참여자 한 명이 12자 이내 단어를 3개까지 보낼 수 있어요'}</p>
      <p class="warn" hidden></p>`;
    const sel = it.querySelector('select'), t = it.querySelector('.t'), box = it.querySelector('.orows');
    sel.value = q.kind; t.value = q.text;
    box.hidden = q.kind !== 'choice';
    const lf = it.querySelector('.linkf'), u = it.querySelector('.u'), dsc = it.querySelector('.dsc');
    lf.hidden = q.kind !== 'link';
    u.value = q.url || ''; dsc.value = q.desc || '';
    u.oninput = () => { q.url = u.value; };
    dsc.oninput = () => { q.desc = dsc.value; };
    if (q.kind === 'choice') renderRows(q, i, box);
    const m = it.querySelector('.m');
    m.checked = !!q.multi; m.closest('.multi').hidden = q.kind !== 'choice';
    m.onchange = () => { q.multi = m.checked; };
    sel.onchange = () => {
      q.kind = sel.value;
      if (q.kind === 'choice' && !(q.rows && q.rows.length)) q.rows = [{ text:'', img:'' }, { text:'', img:'' }];
      renderEditor();
    };
    t.oninput = () => { q.text = t.value; };
    it.querySelector('.up').onclick = () => { if (i > 0){ [draft[i - 1], draft[i]] = [draft[i], draft[i - 1]]; renderEditor(); } };
    it.querySelector('.down').onclick = () => { if (i < draft.length - 1){ [draft[i + 1], draft[i]] = [draft[i], draft[i + 1]]; renderEditor(); } };
    it.querySelector('.del').onclick = () => { if (confirm(`${i + 1}번 질문을 삭제할까요?`)){ draft.splice(i, 1); renderEditor(); } };
    list.appendChild(it);
  });
  if (focus){
    const el = list.querySelector(`.orow[data-q="${focus.q}"][data-r="${focus.r}"] ${focus.img ? '.oimg' : '.otext'}`);
    if (el) el.focus();
  }
}
function renderRows(q, qi, box){
  q.rows = q.rows || [];
  q.rows.forEach((row, r) => {
    const el = document.createElement('div'); el.className = 'orow'; el.dataset.q = qi; el.dataset.r = r;
    el.innerHTML = `
      <button type="button" class="oimg" aria-label="${r + 1}번 보기 이미지"></button>
      <input class="otext" placeholder="보기 ${r + 1}" aria-label="${r + 1}번 보기">
      <button type="button" class="mini rup" aria-label="보기 위로">▲</button><button type="button" class="mini rdown" aria-label="보기 아래로">▼</button>
      <button type="button" class="mini rdel">삭제</button>`;
    const pic = el.querySelector('.oimg'), inp = el.querySelector('.otext');
    if (isImg(row.img)){
      pic.classList.add('has');
      const im = document.createElement('img'); im.alt = ''; im.src = row.img;
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = '이미지 빼기';
      x.onclick = (e) => { e.stopPropagation(); row.img = ''; renderEditor(); };
      pic.append(im, x);
    } else pic.textContent = '+ 이미지';
    pic.onclick = () => { pickTarget = row; picker.click(); };
    inp.value = row.text || '';
    inp.oninput = () => { row.text = inp.value; };
    const up = el.querySelector('.rup'), down = el.querySelector('.rdown'), del = el.querySelector('.rdel');
    up.disabled = r === 0; down.disabled = r === q.rows.length - 1; del.disabled = q.rows.length <= 2;
    up.onclick = () => { [q.rows[r - 1], q.rows[r]] = [q.rows[r], q.rows[r - 1]]; renderEditor(); };
    down.onclick = () => { [q.rows[r + 1], q.rows[r]] = [q.rows[r], q.rows[r + 1]]; renderEditor(); };
    del.onclick = () => { q.rows.splice(r, 1); renderEditor(); };
    box.appendChild(el);
  });
  const add = document.createElement('button'); add.type = 'button'; add.className = 'mini oadd'; add.textContent = '+ 보기 추가';
  add.disabled = q.rows.length >= 8;
  add.onclick = () => {
    q.rows.push({ text:'', img:'' }); renderEditor();
    const ins = $('#edList').querySelectorAll(`.orow[data-q="${qi}"] .otext`); if (ins.length) ins[ins.length - 1].focus();
  };
  box.appendChild(add);
}
$('#edAddChoice').onclick = () => addDraft('choice');
$('#edAddWord').onclick = () => addDraft('word');
$('#edSample').onclick = () => SAMPLES.forEach(s => addDraft(s.kind, s.text, s.options));
$('#edCancel').onclick = () => $('#editor').close();
$('#edSave').onclick = async () => {
  let ok = true;
  document.querySelectorAll('#edList .item').forEach((it, i) => {
    const q = draft[i];
    q.text = q.text.trim();
    const rows = q.kind === 'choice'
      ? (q.rows || []).map(r => ({ text:(r.text || '').trim(), img:isImg(r.img) ? r.img : '' })).filter(r => r.text || r.img).slice(0, 8) : [];
    q.options = rows.map(r => r.text);
    q.optImages = rows.map(r => r.img);
    q.multi = q.kind === 'choice' && !!q.multi;
    q.url = q.kind === 'link' ? (q.url || '').trim() : '';
    q.desc = q.kind === 'link' ? (q.desc || '').trim() : '';
    let msg = '';
    if (!q.text) msg = '질문을 입력해 주세요.';
    else if (rows.some(r => !r.text)) msg = '이미지를 넣은 보기에도 글자를 적어 주세요.';
    else if (q.kind === 'choice' && q.options.length < 2) msg = '보기를 2개 이상 적어 주세요.';
    else if (q.kind === 'link' && !isHttp(q.url)) msg = '주소는 https://로 시작해야 해요';
    else if (JSON.stringify({ text:q.text, options:q.options, optImages:q.optImages }).length > Q_BYTES) msg = '이미지가 너무 커요';
    it.classList.toggle('bad', !!msg);
    const w = it.querySelector('.warn'); w.textContent = msg; w.hidden = !msg;
    if (msg) ok = false;
  });
  if (!ok) return;
  try {
    const keep = new Set(draft.map(q => q.id));
    await Promise.all([
      ...draft.map((q, i) => S.saveQuestion({ id:q.id, kind:q.kind, text:q.text, options:q.options, optImages:q.optImages, multi:q.multi, url:q.url, desc:q.desc, round:q.round || 0, order:i })),
      ...questions.filter(q => !keep.has(q.id)).map(q => S.deleteQuestion(q.id))
    ]);
    const cur = state && draft.find(q => q.id === state.qid);
    if (cur) await S.setState({ kind:cur.kind, text:cur.text, options:cur.options, optImages:cur.optImages, multi:cur.multi, url:cur.url, desc:cur.desc });
    else if (draft.length) await S.setState({ qid:draft[0].id, kind:draft[0].kind, text:draft[0].text, options:draft[0].options, optImages:draft[0].optImages, multi:draft[0].multi, url:draft[0].url, desc:draft[0].desc, round:draft[0].round || 0, open:false, hidden:[] });
    else await S.setState({ qid:null, open:false });
    $('#editor').close();
  } catch (e){ onErr(e); }
};
</script>
